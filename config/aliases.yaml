# Canonical NFL team codes -> known source spellings.
# Aliases resolve NAMES only; they never imply settlement rules (CLAUDE.md §10).
# Matching is case-insensitive and ignores punctuation. Add spellings as new sources reveal them.

leagues:
  NFL:
    teams:
      ARI: ["Arizona Cardinals"]
      ATL: ["Atlanta Falcons"]
      BAL: ["Baltimore Ravens"]
      BUF: ["Buffalo Bills"]
      CAR: ["Carolina Panthers"]
      CHI: ["Chicago Bears"]
      CIN: ["Cincinnati Bengals"]
      CLE: ["Cleveland Browns"]
      DAL: ["Dallas Cowboys"]
      DEN: ["Denver Broncos"]
      DET: ["Detroit Lions"]
      GB:  ["Green Bay Packers"]
      HOU: ["Houston Texans"]
      IND: ["Indianapolis Colts"]
      JAX: ["Jacksonville Jaguars", "JAC"]   # JAC: Kalshi's code
      KC:  ["Kansas City Chiefs"]
      LV:  ["Las Vegas Raiders"]
      LAC: ["Los Angeles Chargers"]
      LAR: ["Los Angeles Rams"]
      MIA: ["Miami Dolphins"]
      MIN: ["Minnesota Vikings"]
      NE:  ["New England Patriots"]
      "NO": ["New Orleans Saints"]   # quoted: bare NO is parsed by YAML as boolean false
      NYG: ["New York Giants"]
      NYJ: ["New York Jets"]
      PHI: ["Philadelphia Eagles"]
      PIT: ["Pittsburgh Steelers"]
      SF:  ["San Francisco 49ers"]
      SEA: ["Seattle Seahawks"]
      TB:  ["Tampa Bay Buccaneers"]
      TEN: ["Tennessee Titans"]
      WAS: ["Washington Commanders"]
